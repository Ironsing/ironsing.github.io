<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />
	<!-- Google tag (gtag.js). Only loaded on the production host so localhost
		     and preview deploys don't pollute the reports, and so crawlers that
		     execute JS on another host can't either. -->
	<script>
		if (location.hostname === 'ironsing.dev') {
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', 'G-HP8HBLK1NS');

			var s = document.createElement('script');
			s.async = true;
			s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HP8HBLK1NS';
			document.head.appendChild(s);
		}
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
